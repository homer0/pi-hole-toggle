# Checks, mirrors, and publishes only trusted main-branch commits.
name: Release

on:
  push:
    branches:
      - main

# Only the newest main push may update GitHub and the mutable latest tag.
concurrency:
  group: pi-hole-toggle-main
  cancel-in-progress: true

jobs:
  release:
    # The CI image provides tooling and an isolated DIND daemon.
    runs-on: ci
    steps:
      # Full history lets Git verify that the GitHub update is a fast-forward.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run checks
        run: |
          bun install --frozen-lockfile
          bun run types:check
          bun run test

      - name: Mirror main to GitHub
        uses: https://forgejo.home.homer0.dev/homer0/forgejo-actions/actions/github-push@main
        with:
          repository: homer0/pi-hole-toggle
          branch: main
          deploy-key: ${{ secrets.GH_DEPLOY_KEY }}

      - name: Preserve and publish images
        uses: https://forgejo.home.homer0.dev/homer0/forgejo-actions/actions/docker-publish@main
        with:
          image-path: homer0/pi-hole-toggle

      - name: Redeploy Pi-hole Toggle
        uses: https://forgejo.home.homer0.dev/homer0/forgejo-actions/actions/portainer-recreate@main
        with:
          url: ${{ secrets.PORTAINER_URL }}
          api-token: ${{ secrets.PORTAINER_API_TOKEN }}
          endpoint-id: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          container-name: pihole-toggle
