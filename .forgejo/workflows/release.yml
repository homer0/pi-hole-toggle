# Checks, mirrors, and publishes only trusted main-branch commits.
name: Release

on:
  push:
    branches:
      - main

# Only the newest main push may update GitHub and the mutable latest tag.
concurrency:
  group: pi-hole-toggle-main
  cancel-in-progress: true

jobs:
  release:
    # The runner's docker label provides Node and an isolated DIND daemon.
    runs-on: docker
    steps:
      # Full history lets Git verify that the GitHub update is a fast-forward.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun and Docker tooling
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl
          npm install --global bun@1.3.14

          case "$(uname -m)" in
            aarch64 | arm64)
              docker_arch='aarch64'
              buildx_arch='arm64'
              ;;
            x86_64 | amd64)
              docker_arch='x86_64'
              buildx_arch='amd64'
              ;;
            *) echo "Unsupported Docker CLI architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          curl --fail --location --silent --show-error \
            "https://download.docker.com/linux/static/stable/${docker_arch}/docker-29.6.2.tgz" \
            | tar --extract --gzip --strip-components=1 --file=- --to-stdout docker/docker \
            > /usr/local/bin/docker
          chmod 755 /usr/local/bin/docker

          install --directory "$HOME/.docker/cli-plugins"
          curl --fail --location --silent --show-error \
            "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-${buildx_arch}" \
            > "$HOME/.docker/cli-plugins/docker-buildx"
          chmod 755 "$HOME/.docker/cli-plugins/docker-buildx"

          docker version
          docker buildx version

      - name: Run checks
        run: |
          bun install --frozen-lockfile
          bun run types:check
          bun run test

      # Secrets are written only to this ephemeral job container.
      - name: Configure GitHub SSH access
        env:
          GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
          GH_KNOWN_HOSTS: ${{ secrets.GH_KNOWN_HOSTS }}
        run: |
          install --directory --mode=700 "$HOME/.ssh"
          printf '%s\n' "$GH_DEPLOY_KEY" > "$HOME/.ssh/github-deploy-key"
          printf '%s\n' "$GH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/github-deploy-key" "$HOME/.ssh/known_hosts"

      # This intentionally permits fast-forward updates only; it never uses --force.
      - name: Mirror main to GitHub
        env:
          GIT_SSH_COMMAND: >-
            ssh -i $HOME/.ssh/github-deploy-key -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts
        run: git push git@github.com:homer0/pi-hole-toggle.git HEAD:main

      # Docker publication does not need the deploy key, so remove it immediately.
      - name: Remove GitHub SSH access
        if: ${{ always() }}
        run: |
          rm -f "$HOME/.ssh/github-deploy-key" "$HOME/.ssh/known_hosts"
          rmdir "$HOME/.ssh" 2>/dev/null || true

      # DOCKER_HOST is injected by the runner and targets its isolated DIND daemon.
      - name: Preserve, build, publish, and remove images
        run: |
          # DIND reaches the registry over the shared user-defined bridge network.
          registry='grid-registry:5000'
          repository='homer0/pi-hole-toggle'
          image="${registry}/${repository}:latest"
          previous_image="${registry}/${repository}:prev"
          manifest="$(mktemp)"
          headers="$(mktemp)"
          buildkit_config="$(mktemp)"
          trap 'rm -f "$manifest" "$headers" "$buildkit_config"' EXIT

          # BuildKit needs explicit plain-HTTP registry support.
          cat > "$buildkit_config" <<EOF
          [registry."${registry}"]
            http = true
          EOF

          # The x86 runner needs emulation to build the Raspberry Pi variant.
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create \
            --name pi-hole-toggle \
            --driver docker-container \
            --buildkitd-config "$buildkit_config" \
            --use \
            --bootstrap

          # Copy the complete existing manifest through the HTTP-only registry.
          curl --fail --location --silent --show-error \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            --dump-header "$headers" \
            --output "$manifest" \
            "http://${registry}/v2/${repository}/manifests/latest"
          manifest_type="$(awk 'tolower($1) == "content-type:" { sub(/\r$/, "", $2); print $2; exit }' "$headers")"
          if [ -z "$manifest_type" ]; then
            echo 'Registry response did not include a manifest content type.' >&2
            exit 1
          fi
          curl --fail --location --silent --show-error \
            --request PUT \
            --header "Content-Type: $manifest_type" \
            --data-binary "@$manifest" \
            "http://${registry}/v2/${repository}/manifests/prev"

          # Publish one manifest with native images for the NAS and Raspberry Pi.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$image" \
            --push \
            .

      # Recreate only this container; its stack and other containers are untouched.
      - name: Redeploy Pi-hole Toggle
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          set -e
          portainer_url="${PORTAINER_URL%/}"
          echo "Looking up pihole-toggle in Portainer endpoint $PORTAINER_ENDPOINT_ID"
          lookup_response="$(mktemp)"
          lookup_status="$(
            # Portainer uses a local custom TLS certificate not trusted by this job image.
            curl --insecure --silent --show-error \
              --output "$lookup_response" \
              --write-out '%{http_code}' \
              --header "X-API-Key: $PORTAINER_API_TOKEN" \
              "$portainer_url/api/endpoints/$PORTAINER_ENDPOINT_ID/docker/containers/json?all=true"
          )"
          if [ "$lookup_status" -lt 200 ] || [ "$lookup_status" -ge 300 ]; then
            echo "Portainer container lookup failed with HTTP $lookup_status" >&2
            cat "$lookup_response" >&2
            exit 1
          fi
          containers="$(cat "$lookup_response")"
          rm -f "$lookup_response"
          container_id="$(
            printf '%s' "$containers" | node -e '
              let payload = "";
              process.stdin.on("data", (chunk) => { payload += chunk; });
              process.stdin.on("end", () => {
                const container = JSON.parse(payload).find(({ Names = [] }) =>
                  Names.includes("/pihole-toggle"),
                );
                if (!container) {
                  throw new Error("Portainer container pihole-toggle was not found");
                }
                console.log(container.Id);
              });
            '
          )"

          echo "Recreating pihole-toggle container ${container_id:0:12}"
          recreate_response="$(mktemp)"
          recreate_status="$(
            curl --insecure --silent --show-error --request POST \
              --output "$recreate_response" \
              --write-out '%{http_code}' \
              --header "X-API-Key: $PORTAINER_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"PullImage":true}' \
              "$portainer_url/api/docker/$PORTAINER_ENDPOINT_ID/containers/$container_id/recreate"
          )"
          if [ "$recreate_status" -lt 200 ] || [ "$recreate_status" -ge 300 ]; then
            echo "Portainer container recreate failed with HTTP $recreate_status" >&2
            cat "$recreate_response" >&2
            exit 1
          fi
          rm -f "$recreate_response"
